<app-navbar></app-navbar>

<section class="relative min-h-screen bg-gradient-to-br from-purple-50 via-indigo-50 to-blue-50 overflow-hidden" style="font-family: 'Barlow', sans-serif;">
  <!-- Blobs de fondo -->
  <div class="absolute inset-0">
    <div class="absolute top-20 -left-20 w-96 h-96 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>
    <div class="absolute top-60 right-0 w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-32 left-1/3 w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-4000"></div>
  </div>

  <div class="relative container mx-auto px-6 lg:px-16 py-28">
    <div class="grid lg:grid-cols-2 gap-16 items-center">
      

      <div class="space-y-8 relative z-10">
        <h1 class="text-6xl md:text-7xl font-black text-gray-900 leading-tight">
          <span class="bg-gradient-to-r from-blue-600 to-teal-500 bg-clip-text text-transparent animate-gradient">
            Revoluciona
          </span>
          <br>
          <span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
            Tu Veterinaría
          </span>
        </h1>

        <div class="relative group">
          <p class="text-2xl md:text-3xl text-gray-800 font-medium transform transition-all duration-500 group-hover:translate-x-2">
            Con <span class="underline-animation">VetAdmin Pro</span> 
            <span class="text-teal-600 font-bold">+32%</span> de eficiencia
          </p>
          <div class="absolute bottom-0 w-32 h-1 bg-indigo-500 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        </div>

        <p class="text-xl text-gray-600 leading-relaxed max-w-2xl">
          La plataforma todo-en-uno que transforma la gestión veterinaria con 
          <span class="font-bold text-purple-600">Inteligencia Artificial</span> y 
          <span class="font-bold text-blue-600">Flujos Automatizados</span>
        </p>

   
        <div class="flex flex-wrap gap-4 mt-10">
          <button class="group relative w-full md:w-auto px-6 py-3 md:px-8 md:py-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white rounded-2xl text-base md:text-lg font-bold transform transition-all duration-300 hover:scale-[1.02] hover:shadow-2xl shadow-indigo-300/50 hover:shadow-indigo-400/30 flex items-center justify-center gap-2 overflow-hidden">

            <div class="absolute inset-0 opacity-0 group-hover:opacity-30 transition-opacity duration-500">
              <div class="absolute top-0 left-1/4 w-1/2 h-full bg-gradient-to-r from-white/50 to-transparent transform -skew-x-12"></div>
            </div>
            
            <svg class="w-5 h-5 md:w-6 md:h-6 group-hover:animate-pulse" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            
            <span class="relative z-10">Demo Interactiva</span>
  
            <div class="absolute inset-0 hidden items-center justify-center bg-indigo-700 loading-state">
              <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </div>
          </button>
          <button class="group relative w-full md:w-auto px-6 py-3 md:px-8 md:py-4 bg-white dark:bg-gray-800 border-2 border-indigo-100 dark:border-gray-700 text-gray-800 dark:text-gray-200 rounded-2xl text-base md:text-lg font-bold transform transition-all duration-300 hover:scale-[1.02] hover:shadow-xl hover:border-indigo-300 dark:hover:border-indigo-500 flex items-center justify-center gap-2">

            <div class="absolute inset-0 rounded-2xl overflow-hidden">
              <div class="absolute inset-0 bg-gradient-to-r from-purple-500 to-indigo-500 opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
            </div>
   
            <svg class="w-5 h-5 md:w-6 md:h-6 text-purple-600 dark:text-purple-400 group-hover:animate-bounce" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
            </svg>
            
            <span>Ver Estadísticas</span>
          </button>
        </div>
        
       
      </div>


      <div class="relative group perspective-2000 transform hover:scale-[1.02] transition-transform duration-500">
        <div class="relative z-10 rounded-3xl shadow-2xl overflow-hidden border-8 border-white transform rotate-y-12 rotate-x-2 group-hover:rotate-y-6 transition-transform duration-700">
          <div class="bg-gradient-to-br from-gray-900 to-gray-800 p-4">
            <!-- Barra superior del dispositivo -->
            <div class="flex justify-between items-center mb-4 text-gray-400">
              <div class="flex space-x-1">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
              </div>
              <span class="text-sm">VetAdmin Pro v1.0</span>
            </div>
            
      
            <div class="relative h-96 overflow-hidden">
              <div class="absolute inset-0 flex animate-slide">
                <img src="https://i.postimg.cc/RF6YPKjn/image.png" class="w-full h-full object-cover" alt="Dashboard">
                <img src="https://i.postimg.cc/ydMb2WHp/image.png" class="w-full h-full object-cover" alt="Calendar">
                <img src="assets/patient-profile.jpg" class="w-full h-full object-cover" alt="Patient Profile">
              </div>
            </div>
          </div>
        </div>
        
 
        <div class="absolute inset-0 bg-gradient-to-t from-white/10 to-transparent rounded-3xl"></div>
        

        <div class="absolute -inset-4 bg-blue-100/30 blur-3xl opacity-0 group-hover:opacity-40 transition-opacity duration-500"></div>
      </div>

    </div>
  </div>

<app-about></app-about>
</section>
