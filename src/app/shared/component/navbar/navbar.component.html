<nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm" style="font-family: 'Barlow', sans-serif;">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        <!-- Logo con estilo veterinario -->
        <a [routerLink]="['/']" class="flex items-center group">
          <div class="relative mr-3">
            <div class="w-10 h-10 rounded-lg bg-green-50 border-2 border-green-100 flex items-center justify-center transition-all duration-300 group-hover:bg-green-100">
              <svg class="w-5 h-5 text-green-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="flex flex-col items-start">
            <span class="text-gray-900 font-bold text-2xl tracking-tight">VetAdmin</span>
            <span class="text-orange-500 font-semibold text-xs tracking-wider mt-0.5">SaaS</span>
          </div>
        </a>
  
        <!-- Navegación principal alineada a la derecha -->
        <div class="flex-1 flex justify-end items-center">
          <div class="hidden md:flex items-center space-x-8 mr-8">
            <a [routerLink]="['/']" 
               class="relative text-gray-700 hover:text-green-600 px-1 py-2 text-base font-medium transition-all duration-300"
               [class.text-green-600]="router.isActive('/', true)">
              <span class="relative z-10">Inicio</span>
              <span class="absolute bottom-0 left-0 w-full h-0.5 bg-green-400 rounded-full transition-all duration-300 transform origin-left scale-x-0 group-hover:scale-x-100"
                    [class.scale-x-100]="router.isActive('/', true)"></span>
            </a>
            <a [routerLink]="['/servicios']" 
               class="relative text-gray-700 hover:text-green-600 px-1 py-2 text-base font-medium transition-all duration-300 group"
               [class.text-green-600]="router.isActive('/servicios', false)">
              <span class="relative z-10">Servicios</span>
              <span class="absolute bottom-0 left-0 w-full h-0.5 bg-green-400 rounded-full transition-all duration-300 transform origin-left scale-x-0 group-hover:scale-x-100"
                    [class.scale-x-100]="router.isActive('/servicios', false)"></span>
            </a>
            <a [routerLink]="['/clinicas']" 
               class="relative text-gray-700 hover:text-green-600 px-1 py-2 text-base font-medium transition-all duration-300 group"
               [class.text-green-600]="router.isActive('/clinicas', false)">
              <span class="relative z-10">Clínicas</span>
              <span class="absolute bottom-0 left-0 w-full h-0.5 bg-green-400 rounded-full transition-all duration-300 transform origin-left scale-x-0 group-hover:scale-x-100"
                    [class.scale-x-100]="router.isActive('/clinicas', false)"></span>
            </a>
            <a [routerLink]="['/contacto']" 
               class="relative text-gray-700 hover:text-green-600 px-1 py-2 text-base font-medium transition-all duration-300 group"
               [class.text-green-600]="router.isActive('/contacto', false)">
              <span class="relative z-10">Contacto</span>
              <span class="absolute bottom-0 left-0 w-full h-0.5 bg-green-400 rounded-full transition-all duration-300 transform origin-left scale-x-0 group-hover:scale-x-100"
                    [class.scale-x-100]="router.isActive('/contacto', false)"></span>
            </a>
          </div>
  
          <!-- Botones de acción con estilo creativo -->
          <div class="hidden md:flex items-center space-x-4">
            <button (click)="openLogin()" 
                    class="relative overflow-hidden text-green-600 hover:text-green-700 px-5 py-2.5 rounded-lg text-base font-medium transition-all duration-300 group flex items-center gap-2">
              <span class="material-icons">login</span>
              <span class="relative z-10">Ingresar</span>
              <span class="absolute inset-0 border border-green-200 rounded-lg -z-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
            </button>
            <button (click)="openSignup()" 
                    class="relative overflow-hidden bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white px-5 py-2.5 rounded-lg text-base font-medium transition-all duration-300 group shadow-md hover:shadow-lg flex items-center gap-2">
              <span class="material-icons">person_add</span>
              <span class="relative z-10">Registrarse</span>
              <span class="absolute inset-0 bg-gradient-to-r from-green-600 to-green-700 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 -z-0"></span>
            </button>
          </div>
  
          <!-- Menú móvil -->
          <button (click)="toggleMenu()" 
                  class="md:hidden inline-flex items-center justify-center p-2 rounded-lg text-gray-600 hover:text-green-600 hover:bg-green-50 focus:outline-none transition-all duration-300"
                  aria-label="Toggle menu">
            <svg class="h-7 w-7" 
                 xmlns="http://www.w3.org/2000/svg" 
                 fill="none" 
                 viewBox="0 0 24 24" 
                 stroke="currentColor"
                 [class.hidden]="isMenuOpen">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
            <svg class="h-7 w-7" 
                 xmlns="http://www.w3.org/2000/svg" 
                 fill="none" 
                 viewBox="0 0 24 24" 
                 stroke="currentColor"
                 [class.hidden]="!isMenuOpen">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>
  
      <!-- Menú móvil desplegable -->
      <div class="md:hidden transition-all duration-500 ease-in-out overflow-hidden bg-white/95 backdrop-blur-sm" 
           [class.max-h-0]="!isMenuOpen"
           [class.max-h-screen]="isMenuOpen">
        <div class="px-4 pt-3 pb-6 space-y-2">
          <a [routerLink]="['/']" 
             (click)="toggleMenu()"
             class="block text-gray-700 hover:bg-green-50 hover:text-green-600 px-4 py-3 rounded-lg text-base font-medium transition-colors duration-300"
             [class.bg-green-50]="router.isActive('/', true)"
             [class.text-green-600]="router.isActive('/', true)">
            Inicio
          </a>
          <a [routerLink]="['/servicios']" 
             (click)="toggleMenu()"
             class="block text-gray-700 hover:bg-green-50 hover:text-green-600 px-4 py-3 rounded-lg text-base font-medium transition-colors duration-300"
             [class.bg-green-50]="router.isActive('/servicios', false)"
             [class.text-green-600]="router.isActive('/servicios', false)">
            Servicios
          </a>
          <a [routerLink]="['/clinicas']" 
             (click)="toggleMenu()"
             class="block text-gray-700 hover:bg-green-50 hover:text-green-600 px-4 py-3 rounded-lg text-base font-medium transition-colors duration-300"
             [class.bg-green-50]="router.isActive('/clinicas', false)"
             [class.text-green-600]="router.isActive('/clinicas', false)">
            Clínicas
          </a>
          <a [routerLink]="['/contacto']" 
             (click)="toggleMenu()"
             class="block text-gray-700 hover:bg-green-50 hover:text-green-600 px-4 py-3 rounded-lg text-base font-medium transition-colors duration-300"
             [class.bg-green-50]="router.isActive('/contacto', false)"
             [class.text-green-600]="router.isActive('/contacto', false)">
            Contacto
          </a>
          
          <div class="pt-4 border-t border-gray-200 mt-2 space-y-3 px-1">
            <button (click)="openLogin(); toggleMenu()" 
                    class="w-full text-green-600 hover:bg-green-50 px-4 py-3 rounded-lg text-base font-medium transition-colors duration-300 border border-green-600 flex items-center justify-center gap-2">
              <span class="material-icons">login</span> Iniciar
            </button>
            <button (click)="openSignup(); toggleMenu()" 
                    class="w-full bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white px-4 py-3 rounded-lg text-base font-medium transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2">
              <span class="material-icons">person_add</span> Registrarse
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>
